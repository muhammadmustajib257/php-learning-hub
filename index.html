button,input,textarea,select{font:inherit}button{cursor:pointer}

pre{position:relative;background:#0b1220;color:#e2e8f0;padding:18px;border-radius:12px;overflow:auto;line-height:1.58}.copy{position:absolute;right:9px;top:9px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;padding:6px 9px;border-radius:7px;font-size:12px}code{font-family:Consolas,Monaco,monospace;font-size:13px}
.table{width:100%;border-collapse:collapse;margin:13px 0}.table th,.table td{border:1px solid var(--line);padding:10px;text-align:left}.table th{background:#f8fafc}

.playground{border:1px solid #cbd5e1;background:#f8fafc;border-radius:15px;padding:16px;margin-top:20px}.play-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.play-head h3{margin:0}.editor{width:100%;min-height:220px;resize:vertical;background:#0b1220;color:#e2e8f0;border:0;border-radius:10px;padding:15px;font:13px/1.6 Consolas,monospace;outline:none;margin:10px 0}.output{min-height:100px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:14px;white-space:pre-wrap;font-family:Consolas,monospace;overflow:auto}.out-title{font-weight:700;margin:5px 0 8px}.simnote{font-size:12px;color:#64748b;margin:7px 0}
.explain-details{margin:10px 0 20px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;overflow:hidden}.explain-details summary{cursor:pointer;padding:12px 14px;font-weight:700;color:#1e3a8a;background:#eff6ff}.line-explain{padding:8px 10px}.line-row{display:grid;grid-template-columns:42px minmax(280px,1fr) minmax(240px,1fr);gap:10px;align-items:stretch;border-bottom:1px solid #e5e7eb;padding:7px 0}.line-row:last-child{border-bottom:0}.line-no{display:grid;place-items:center;color:#64748b;font-weight:700;background:#f1f5f9;border-radius:7px;min-height:38px}.line-code{margin:0;padding:9px 10px;border-radius:8px;min-height:38px;white-space:pre-wrap}.line-code code{font-size:12px}.line-desc{padding:9px 11px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;color:#475569;font-size:13px;line-height:1.55}.simnote{font-size:12px;color:#64748b;margin:7px 0}
@media(max-width:800px){.line-row{grid-template-columns:32px 1fr}.line-desc{grid-column:2}.line-code{min-width:0}.explain-details summary{font-size:13px}}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.quiz-option{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:11px;margin:8px 0;transition:.18s;position:relative}
.quiz-option:hover{border-color:#93c5fd;background:#f8fbff;transform:translateY(-1px)}
.quiz-option .choice-letter{display:grid;place-items:center;min-width:28px;height:28px;border:1px solid #cbd5e1;border-radius:8px;font-weight:800;color:#475569;background:#f8fafc}
.quiz-option .choice-text{flex:1;line-height:1.5}
.quiz-option.selected{border:2px solid #2563eb;background:#eff6ff;color:#1d4ed8;padding:12px 13px}
.quiz-option.selected .choice-letter{background:#2563eb;border-color:#2563eb;color:#fff}
.quiz-option.correct{background:#f0fdf4;border-color:#86efac;color:#166534}
.quiz-option.correct .choice-letter{background:#16a34a;border-color:#16a34a;color:#fff}
.quiz-option.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.quiz-option.wrong .choice-letter{background:#dc2626;border-color:#dc2626;color:#fff}

.quiz-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:15px;padding:18px;margin:15px 0}
.quiz-card.answered{border-color:#bfdbfe}
.quiz-number{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#dbeafe;color:#1d4ed8;font-weight:900;margin-right:8px}
.quiz-feedback{margin-top:10px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.quiz-feedback.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.quiz-feedback.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.quiz-feedback.neutral{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.quiz-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.quiz-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.quiz-stat{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;text-align:center}
.quiz-stat b{display:block;font-size:24px;color:#1e3a8a}
.module-cover{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;border-radius:18px;padding:30px;margin-bottom:20px}

.mobile{display:none}
@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile{display:inline-block}.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}.top{padding:0 13px}.content{padding:20px 13px 50px}}

/* Final simulator enhancements */
.simulator-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}
.sim-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.sim-badge.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.sim-badge.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.sim-help{padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);color:#475569;font-size:13px;line-height:1.6;margin-bottom:12px}
.sim-help b{color:#172033}
.output.success{border-color:#86efac;background:#f0fdf4}
.output.warn{border-color:#fdba74;background:#fff7ed}
.output.error{border-color:#fca5a5;background:#fef2f2}
.run-meta{font-size:12px;color:#64748b;margin-top:8px}

/* Interactive PHP input panel */
.sim-input-panel{display:none;margin:14px 0;padding:16px;border:1px solid #bfdbfe;background:#f8fbff;border-radius:14px}

.sim-input-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.sim-input-head strong{font-size:14px}.sim-input-head span{font-size:12px;color:#64748b}
.sim-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.sim-input-field label{display:block;font-size:12px;font-weight:800;color:#334155;margin-bottom:6px}
.sim-input-field input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;outline:none}
.sim-input-field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.sim-input-note{margin-top:10px;font-size:12px;color:#64748b;line-height:1.5}
.output{white-space:pre-wrap;min-height:110px}

/* Professional learning lab UI */
.lab-shell{margin-top:16px;border:1px solid #dbe3ef;border-radius:16px;overflow:hidden;background:#fff}
.lab-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff}
.lab-head h4{margin:0;font-size:15px}.lab-head small{color:#cbd5e1}.lab-body{padding:15px}.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lab-step{border:1px solid var(--line);border-radius:11px;padding:11px;background:#f8fafc}.lab-step b{display:block;margin-bottom:5px}.lab-step span{font-size:12px;color:#64748b;line-height:1.5}.server-output{border:1px solid #fdba74;background:#fff7ed;border-radius:12px;padding:15px;line-height:1.6}.server-output .server-title{font-weight:800;color:#9a3412;margin-bottom:7px}.server-output ol{margin:8px 0;padding-left:21px}.server-output code{background:#ffedd5;padding:2px 5px;border-radius:5px}.sim-input-panel.active{box-shadow:0 2px 10px rgba(37,99,235,.05)}
@media(max-width:800px){.lab-grid{grid-template-columns:1fr}.lab-head{align-items:flex-start;flex-direction:column}}
@media print{
 body{background:#fff!important;color:#111!important}
 .sidebar,.top,.lesson-nav,.playground,.copy,.btn,.quiz-toolbar{display:none!important}
 .main{margin-left:0!important;width:100%!important}
 .content{max-width:none!important;padding:0!important}
 .card,.module-cover,.module-section{box-shadow:none!important;border:0!important;border-bottom:1px solid #ccc!important;border-radius:0!important}
 .module-cover{background:#fff!important;color:#111!important;padding:0!important}
 pre{white-space:pre-wrap!important;color:#111!important;background:#f5f5f5!important;border:1px solid #ccc!important}

.quiz-navigator{display:flex;flex-wrap:wrap;gap:7px;padding:12px;margin:12px 0 18px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}

<script>
const lessons=[
  {
    "title": "Pengenalan PHP",
    "level": "Dasar",
    "goal": "Memahami apa itu PHP, cara kerja PHP, perbedaan PHP dengan HTML/CSS/JavaScript, dan contoh penggunaan PHP dalam aplikasi sehari-hari.",
    "keywords": [
      "php",
      "server",
      "website",
      "dinamis"
    ],
    "explain": "PHP (PHP: Hypertext Preprocessor) adalah bahasa pemrograman yang umum digunakan untuk membuat aplikasi web dinamis. PHP diproses di server. Browser tidak menerima kode PHP mentah, tetapi menerima hasil yang sudah diproses oleh server. Karena itu PHP cocok untuk halaman yang membutuhkan logika, input pengguna, login, pengolahan data, dan koneksi database.",
    "analogy": "Bayangkan website seperti restoran. HTML adalah kerangka meja dan ruangan, CSS adalah dekorasi dan warna, JavaScript dapat membuat interaksi di meja, sedangkan PHP adalah koki di dapur yang menerima pesanan, mengolah data, lalu mengirim hasilnya kepada pelanggan. Database adalah gudang penyimpanan data.",
    "points": [
      "PHP diproses di server.",
      "Browser menerima hasil pemrosesan PHP.",
      "File PHP biasanya berekstensi .php.",
      "PHP dapat menghasilkan HTML.",
      "PHP dapat menerima input dari form.",
      "PHP dapat terhubung ke MySQL/MariaDB.",
      "PHP banyak digunakan untuk login, CRUD, sistem informasi, dan aplikasi sekolah."
    ],
    "subtopics": [
      "Apa itu PHP",
      "Cara kerja PHP",

    "guided": "Setelah membaca materi, siswa harus dapat menjelaskan dengan kalimat sendiri mengapa file PHP perlu dijalankan melalui server ketika kode PHP benar-benar digunakan.",
    "examples": [
      [
        "Program PHP pertama",
        "<?php\necho \"Halo Dunia!\";\n?>"
      ],
      [
        "PHP menghasilkan HTML",
        "<!DOCTYPE html>\n<html>\n<body>\n    <h1>Profil Siswa</h1>\n    <?php\n        echo \"Nama: Andi\";\n        echo \"<br>Kelas: X RPL\";\n    ?>\n</body>\n</html>"

      [
        "Informasi dinamis sederhana",
        "<?php\n$nama = \"Andi\";\n$kelas = \"X RPL\";\necho \"Nama: \" . $nama;\necho \"<br>Kelas: \" . $kelas;\n?>"

    "errors": [

    "title": "XAMPP dan Menjalankan PHP",

    "goal": "Mampu menyiapkan lingkungan kerja PHP menggunakan XAMPP, membuat project, dan menjalankannya melalui localhost.",

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lineExplain(line){
 const raw=line, s=line.trim();
 if(!s) return "Baris kosong untuk membuat kode lebih mudah dibaca.";
 if(s.startsWith("<?php")) return "Membuka blok PHP. Kode PHP yang berada setelah baris ini akan diproses oleh PHP.";
 if(s==="?>" || s==="?>;") return "Menutup blok PHP.";
 if(s.startsWith("//")) return "Komentar satu baris. Baris ini hanya menjadi catatan untuk programmer dan tidak dijalankan.";
 if(s.startsWith("#")) return "Komentar satu baris. Digunakan sebagai catatan dan tidak dijalankan.";
 if(s.startsWith("/*")) return "Memulai komentar beberapa baris.";
 if(s.endsWith("*/")) return "Mengakhiri komentar beberapa baris.";
 if(/^<!DOCTYPE html/i.test(s)) return "Memberi tahu browser bahwa dokumen menggunakan standar HTML5.";
 if(/^<html/i.test(s)) return "Membuka elemen utama HTML yang membungkus seluruh halaman.";
 if(/^<\/html/i.test(s)) return "Menutup elemen utama HTML.";
 if(/^<head/i.test(s)) return "Membuka bagian head, tempat informasi halaman dan konfigurasi ditempatkan.";
 if(/^<\/head/i.test(s)) return "Menutup bagian head.";
 if(/^<body/i.test(s)) return "Membuka bagian body, yaitu bagian yang berisi isi halaman yang terlihat.";
 if(/^<\/body/i.test(s)) return "Menutup bagian body.";
 if(/^<h[1-6]/i.test(s)) return "Membuat judul/heading pada halaman HTML.";
 if(/^<\/h[1-6]/i.test(s)) return "Menutup elemen heading.";
 if(/^<br/i.test(s)) return "Membuat pindah baris pada tampilan HTML.";
 if(/^<form/i.test(s)) return "Membuka form HTML. Atribut method menentukan cara data dikirim ke PHP.";
 if(/^<\/form/i.test(s)) return "Menutup form HTML.";
 if(/^<input/i.test(s)) return "Membuat kotak input agar pengguna dapat memasukkan data.";
 if(/^<button/i.test(s)) return "Membuat tombol pada form.";
 if(/^<\/button/i.test(s)) return "Menutup elemen tombol.";
 if(/^<label/i.test(s)) return "Membuat label/keterangan untuk sebuah input.";
 if(/^<\/label/i.test(s)) return "Menutup elemen label.";
 if(/^echo\b/.test(s)){
   return "Perintah echo digunakan untuk menampilkan teks atau hasil ke halaman. Titik koma (;) menandai akhir perintah.";
 }
 if(/^var_dump\b/.test(s)) return "var_dump() menampilkan informasi nilai dan tipe data sebuah variabel. Berguna untuk memeriksa isi data saat belajar/debugging.";
 if(/^function\s+/.test(s)){
   const m=s.match(/^function\s+(\w+)/);
   return `Mendefinisikan function bernama ${m?m[1]:"tersebut"}. Function adalah blok kode yang dapat dipanggil kembali.`;
 }
 if(/^return\b/.test(s)) return "return mengembalikan hasil dari function kepada bagian program yang memanggilnya.";
 if(/^if\s*\(/.test(s)) return "if memeriksa sebuah kondisi. Jika kondisi bernilai benar (true), kode di dalam blok ini dijalankan.";
 if(/^elseif\s*\(/.test(s)) return "elseif memeriksa kondisi alternatif jika kondisi sebelumnya tidak terpenuhi.";
 if(/^else\s*\{/.test(s)) return "else dijalankan jika kondisi if/elseif sebelumnya tidak terpenuhi.";
 if(/^for\s*\(/.test(s)) return "for membuat perulangan. Bagian di dalam kurung menentukan nilai awal, kondisi berhenti, dan perubahan penghitung.";
 if(/^while\s*\(/.test(s)) return "while mengulang kode selama kondisi di dalam kurung masih bernilai benar.";
 if(/^foreach\s*\(/.test(s)) return "foreach mengambil data array satu per satu agar setiap elemen dapat diproses.";
 if(/^include\b/.test(s)) return "include memasukkan isi file PHP lain ke file yang sedang dijalankan.";
 if(/^require\b/.test(s)) return "require memasukkan file lain dan biasanya digunakan untuk file yang wajib tersedia.";
 if(/^\$[A-Za-z_]\w*\s*=/.test(s)){
   const m=s.match(/^\$([A-Za-z_]\w*)/);
   return `Membuat atau mengisi variabel $${m?m[1]:"tersebut"}. Tanda = digunakan untuk memberikan nilai kepada variabel.`;
 }
 if(/^\$\w+\s*\+\+/.test(s)) return "Menambah nilai variabel penghitung sebanyak 1 pada setiap putaran.";
 if(/^\$\w+\s*\+=/.test(s)) return "Menambah nilai variabel dengan nilai tertentu.";
 if(/^mysqli_connect\s*\(/.test(s)) return "Membuat koneksi PHP ke database MySQL/MariaDB menggunakan host, username, password, dan nama database.";
 if(/^mysqli_prepare\s*\(/.test(s)) return "Menyiapkan query SQL dengan prepared statement agar input pengguna tidak langsung digabungkan ke SQL.";
 if(/^mysqli_stmt_bind_param\s*\(/.test(s)) return "Mengikat nilai variabel ke placeholder (?) pada prepared statement.";
 if(/^mysqli_stmt_execute\s*\(/.test(s)) return "Menjalankan prepared statement yang sudah disiapkan.";
 if(/^mysqli_query\s*\(/.test(s)) return "Mengirim query SQL ke database menggunakan koneksi yang tersedia.";
 if(/^while\s*\(\s*\$\w+\s*=\s*mysqli_fetch_assoc/.test(s)) return "Mengambil setiap baris hasil query sebagai associative array selama masih ada data.";
 if(/^mysqli_fetch_assoc\s*\(/.test(s)) return "Mengambil satu baris hasil query dalam bentuk associative array.";
 if(/^if\s*\(!\$koneksi/.test(s)) return "Memeriksa apakah koneksi database gagal.";
 if(/^die\s*\(/.test(s)) return "Menghentikan program dan menampilkan pesan ketika kondisi error terjadi.";
 if(/^htmlspecialchars\s*\(/.test(s)) return "Mengubah karakter khusus HTML menjadi bentuk aman saat menampilkan input pengguna.";
 if(/^CREATE\s+DATABASE/i.test(s)) return "Perintah SQL untuk membuat database baru.";
 if(/^CREATE\s+TABLE/i.test(s)) return "Perintah SQL untuk membuat tabel baru di dalam database.";
 if(/^SELECT\b/i.test(s)) return "Perintah SQL SELECT digunakan untuk mengambil data dari tabel.";
 if(/^INSERT\b/i.test(s)) return "Perintah SQL INSERT digunakan untuk menambahkan data baru ke tabel.";
 if(/^UPDATE\b/i.test(s)) return "Perintah SQL UPDATE digunakan untuk mengubah data yang sudah ada.";
 if(/^DELETE\b/i.test(s)) return "Perintah SQL DELETE digunakan untuk menghapus data.";
 if(/^WHERE\b/i.test(s)) return "WHERE menentukan baris/data tertentu yang menjadi target operasi SQL.";
 if(s==="{" ) return "Kurung kurawal membuka blok kode.";
 if(s==="}") return "Kurung kurawal menutup blok kode.";
 if(s.endsWith(";")) return "Baris ini merupakan statement/perintah PHP. Titik koma (;) menandai akhir statement.";
 if(s.includes("=>")) return "Simbol => menghubungkan key dengan value pada associative array.";
 return "Baris ini merupakan bagian dari kode yang menjalankan instruksi pada program.";
}

function detectInputFields(code){

 while((m=re.exec(code))){if(!fields.includes(m[1]))fields.push(m[1]);}
 return fields;
}

function findTopOperator(expr,ops){

function detectUnsupported(code){

 for(const st of splitStatements(s)){parseArrayAssignment(st,vars);parseAssignment(st,vars);}

   <div id="qres${i}"></div></div>`;
 });
 h+=`<div class="quiz-toolbar"><button class="btn primary" onclick="grade()">📤 Kirim Jawaban</button><button class="btn" onclick="quiz()">↻ Ulangi Kuis</button></div><div id="score"></div></div>`;
 document.getElementById("content").innerHTML=h;
 window.scrollTo({top:0,behavior:"smooth"});
}
function ans(i,j,b){
 answers[i]=j;
 document.querySelectorAll('[data-question="'+i+'"]').forEach(btn=>{
   btn.classList.toggle("selected",Number(btn.dataset.choice)===j);
 });
 const card=document.getElementById("qcard"+i);
 if(card)card.classList.add("answered");
 const navBtn=document.getElementById("qnav"+i);
 if(navBtn)navBtn.classList.add("answered");
 const res=document.getElementById("qres"+i);
 if(res)res.innerHTML='<div class="quiz-feedback neutral">✓ Jawaban dipilih. Anda masih dapat mengubahnya sebelum mengirim.</div>';
}
function grade(){
 let correct=0,wrong=0,unanswered=0;
 quizData.forEach((q,i)=>{
   const selected=answers[i];
   const isUnanswered=selected===undefined;
   if(isUnanswered)unanswered++;
   else if(selected===q[2])correct++;
   else wrong++;
   document.querySelectorAll('[data-question="'+i+'"]').forEach(btn=>{
     const choice=Number(btn.dataset.choice);
     btn.disabled=true;
     btn.classList.remove("selected");
     if(choice===q[2])btn.classList.add("correct");
     if(!isUnanswered && choice===selected && selected!==q[2])btn.classList.add("wrong");
   });
   const navBtn=document.getElementById("qnav"+i);
   if(navBtn){
     navBtn.classList.remove("answered");
     navBtn.classList.add(isUnanswered?"unanswered":selected===q[2]?"nav-correct":"nav-wrong");
   }
   const res=document.getElementById("qres"+i);
   const correctText=String.fromCharCode(65+q[2])+". "+q[1][q[2]];
   const selectedText=isUnanswered?"Belum dijawab":String.fromCharCode(65+selected)+". "+q[1][selected];
   const ok=!isUnanswered && selected===q[2];
   res.innerHTML=`<div class="quiz-feedback ${ok?"ok":isUnanswered?"neutral":"bad"}"><b>${ok?"✅ Benar":isUnanswered?"⚠️ Belum dijawab":"❌ Salah"}</b><br><b>Jawaban Anda:</b> ${esc(selectedText)}<br><b>Jawaban benar:</b> ${esc(correctText)}<br><span>${quizExplanation(i)}</span></div>`;
 });
 const score=Math.round(correct/quizData.length*100);
 const passed=score>=75;
 const result={score,correct,wrong,unanswered,date:new Date().toLocaleString("id-ID")};
 localStorage.setItem("phpHubLastQuiz",JSON.stringify(result));
 document.getElementById("score").innerHTML=`<div class="card" style="border:2px solid ${passed?"#86efac":"#fed7aa"};background:${passed?"#f0fdf4":"#fffaf0"}"><h3 style="margin-top:0">📊 Hasil Evaluasi</h3><div class="quiz-summary"><div class="quiz-stat"><b>${score}</b>Nilai</div><div class="quiz-stat"><b>${correct}</b>Benar</div><div class="quiz-stat"><b>${wrong}</b>Salah</div><div class="quiz-stat"><b>${unanswered}</b>Kosong</div></div><p><b>${passed?"🎉 Selamat!":"📚 Tetap semangat!"}</b> ${passed?"Anda mencapai nilai minimal 75. Pelajari kembali pembahasan untuk memperkuat pemahaman.":"Pelajari kembali materi yang masih salah, kemudian ulangi kuis."}</p><p class="muted">Hasil terakhir tersimpan di browser perangkat ini pada ${result.date}.</p><button class="btn" onclick="quiz()">↻ Kerjakan Ulang</button></div>`;
 document.getElementById("score").scrollIntoView({behavior:"smooth",block:"start"});
}
function quizExplanation(i){
 return quizData[i]?.[3] || "Periksa kembali materi terkait soal ini.";
}

function toggleNavigation(){
  const app=document.getElementById("appRoot");
  const sidebar=document.getElementById("sidebar");
  const main=document.querySelector(".main");
  if(window.innerWidth<=950){
    sidebar.classList.toggle("open");
  }else{
    const willCollapse=!app.classList.contains("nav-collapsed");
    app.classList.toggle("nav-collapsed",willCollapse);
    if(willCollapse){
      sidebar.style.width="76px";
      if(main){main.style.marginLeft="76px";main.style.width="calc(100% - 76px)";}
    }else{
      sidebar.style.width="";
      if(main){main.style.marginLeft="";main.style.width="";}
    }
  }
  updateNavToggle();
}
function updateNavToggle(){
  const app=document.getElementById("appRoot");
  const sidebar=document.getElementById("sidebar");
  const btn=document.getElementById("navToggleBtn");
  if(!btn) return;
  const collapsed=app.classList.contains("nav-collapsed");
  const mobileOpen=sidebar.classList.contains("open");
  btn.textContent=(window.innerWidth<=950 ? (mobileOpen?"✕":"☰") : (collapsed?"☰":"☰"));
  btn.title=window.innerWidth<=950 ? (mobileOpen?"Tutup navigasi":"Buka navigasi") : (collapsed?"Perbesar navigasi":"Perkecil navigasi");
  btn.setAttribute("aria-label",btn.title);
}
window.addEventListener("resize",()=>{
  const app=document.getElementById("appRoot");
  const sidebar=document.getElementById("sidebar");
  const main=document.querySelector(".main");
  if(window.innerWidth<=950){
    sidebar.style.width="";
    if(main){main.style.marginLeft="";main.style.width="";}
  }else if(app.classList.contains("nav-collapsed")){
    sidebar.style.width="76px";
    if(main){main.style.marginLeft="76px";main.style.width="calc(100% - 76px)";}
  }
  updateNavToggle();
});
