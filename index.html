.playground{border:1px solid #cbd5e1;background:#f8fafc;border-radius:15px;padding:16px;margin-top:20px}.play-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.play-head h3{margin:0}.editor{width:100%;min-height:220px;resize:vertical;background:#0b1220;color:#e2e8f0;border:0;border-radius:10px;padding:15px;font:13px/1.6 Consolas,monospace;outline:none;margin:10px 0}.output{min-height:100px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:14px;white-space:pre-wrap;font-family:Consolas,monospace;overflow:auto}.out-title{font-weight:700;margin:5px 0 8px}.simnote{font-size:12px;color:#64748b;margin:7px 0}
.explain-details{margin:10px 0 20px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;overflow:hidden}.explain-details summary{cursor:pointer;padding:12px 14px;font-weight:700;color:#1e3a8a;background:#eff6ff}.line-explain{padding:8px 10px}.line-row{display:grid;grid-template-columns:42px minmax(280px,1fr) minmax(240px,1fr);gap:10px;align-items:stretch;border-bottom:1px solid #e5e7eb;padding:7px 0}.line-row:last-child{border-bottom:0}.line-no{display:grid;place-items:center;color:#64748b;font-weight:700;background:#f1f5f9;border-radius:7px;min-height:38px}.line-code{margin:0;padding:9px 10px;border-radius:8px;min-height:38px;white-space:pre-wrap}.line-code code{font-size:12px}.line-desc{padding:9px 11px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;color:#475569;font-size:13px;line-height:1.55}.simnote{font-size:12px;color:#64748b;margin:7px 0}

/* Interactive PHP input panel */

/* Professional learning lab UI */
.lab-shell{margin-top:16px;border:1px solid #dbe3ef;border-radius:16px;overflow:hidden;background:#fff}

.lab-head h4{margin:0;font-size:15px}.lab-head small{color:#cbd5e1}.lab-body{padding:15px}.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lab-step{border:1px solid var(--line);border-radius:11px;padding:11px;background:#f8fafc}.lab-step b{display:block;margin-bottom:5px}.lab-step span{font-size:12px;color:#64748b;line-height:1.5}.server-output{border:1px solid #fdba74;background:#fff7ed;border-radius:12px;padding:15px;line-height:1.6}.server-output .server-title{font-weight:800;color:#9a3412;margin-bottom:7px}.server-output ol{margin:8px 0;padding-left:21px}.server-output code{background:#ffedd5;padding:2px 5px;border-radius:5px}.sim-input-panel.active{box-shadow:0 2px 10px rgba(37,99,235,.05)}
@media(max-width:800px){.lab-grid{grid-template-columns:1fr}.lab-head{align-items:flex-start;flex-direction:column}}

<script>
const lessons=[
{
title:"Pengenalan PHP",level:"Dasar",goal:"Memahami pengertian PHP, cara kerja PHP, dan kapan PHP digunakan.",keywords:["php","server","website"],
explain:`PHP adalah bahasa pemrograman yang digunakan untuk membuat website dinamis. Berbeda dari HTML yang terutama menyusun struktur halaman dan CSS yang mengatur tampilan, PHP dapat menerima input, mengolah data, mengambil data dari database, lalu menghasilkan halaman yang dikirim ke browser.`,
analogy:`Bayangkan sebuah restoran. HTML adalah bentuk meja, kursi, dan daftar menu. CSS adalah warna, dekorasi, dan tata letak restoran. PHP adalah koki yang menerima pesanan, mengolahnya, dan menyiapkan hasil. Database adalah gudang tempat bahan dan data disimpan.`,
points:["PHP berjalan di server.","Browser menerima hasil yang sudah diproses server.","PHP dapat terhubung ke MySQL/MariaDB.","File PHP umumnya berekstensi .php.","PHP cocok untuk aplikasi seperti data siswa, login, CRUD, dan sistem informasi."],
examples:[["PHP paling sederhana",`<?php
echo "Halo Dunia!";
?>`],["PHP di dalam HTML",`<!DOCTYPE html>
<html>
<body>
    <h1>Data Siswa</h1>
    <?php
        echo "Nama: Andi";
        echo "<br>Kelas: X RPL";
    ?>
</body>
</html>`]],
errors:["Menyimpan file sebagai .html padahal ingin menjalankan PHP.","Membuka file PHP dengan double-click tanpa server.","Lupa menulis titik koma pada statement tertentu."],
task:"Buat index.php yang menampilkan nama, kelas, jurusan, dan kalimat motivasi menggunakan echo.",
challenge:"Tambahkan tanggal belajar dan tampilkan dalam satu halaman."
},
{
title:"XAMPP dan Menjalankan PHP",level:"Dasar",goal:"Mampu membuat project PHP lokal dan menjalankannya melalui Apache.",keywords:["xampp","apache","localhost","htdocs"],
explain:`XAMPP adalah paket lingkungan server lokal. Untuk pembelajaran PHP, Apache berfungsi sebagai web server dan MySQL/MariaDB dapat digunakan sebagai database. Folder project PHP di Windows umumnya diletakkan di C:\\xampp\\htdocs.`,
analogy:`XAMPP seperti bengkel latihan di komputer. Apache adalah mekanik yang menerima permintaan halaman PHP, PHP adalah bahasa yang digunakan untuk mengerjakan proses, dan browser adalah tempat kita melihat hasilnya.`,
points:["Nyalakan Apache dari XAMPP Control Panel.","Buat folder project di htdocs.","Akses project melalui http://localhost/nama_folder/.","Untuk database, nyalakan MySQL/MariaDB.","phpMyAdmin digunakan untuk mengelola database."],
examples:[["Struktur project",`C:\\xampp\\htdocs\\belajar_php\\
├── index.php
└── style.css`],["index.php",`<?php
echo "PHP berjalan melalui XAMPP";
?>`],["Alamat browser",`http://localhost/belajar_php/`]],
errors:["Apache belum aktif.","Folder diletakkan di luar htdocs lalu dicoba lewat localhost.","Port Apache bentrok dengan aplikasi lain."],
task:"Buat folder belajar_php di htdocs, buat index.php, lalu tampilkan tulisan 'PHP saya berhasil berjalan'.",
challenge:"Buat halaman kedua bernama profil.php dan hubungkan dari index.php."
},
{
title:"Sintaks Dasar PHP",level:"Dasar",goal:"Memahami tag PHP, statement, komentar, echo, dan aturan penulisan.",keywords:["syntax","echo","komentar","semicolon"],
explain:`Sintaks adalah aturan penulisan bahasa pemrograman. PHP biasanya diawali dengan <?php. Setiap perintah yang selesai biasanya diakhiri titik koma (;). Komentar digunakan untuk memberi catatan pada kode dan tidak diproses sebagai perintah.`,
analogy:`Sintaks seperti aturan menulis surat resmi. Jika susunannya tidak sesuai, pembaca bisa bingung. Pada pemrograman, kesalahan sintaks dapat membuat program gagal dijalankan.`,
points:["Gunakan <?php untuk membuka kode PHP.","Statement umumnya diakhiri ;.","Komentar tidak dijalankan.","PHP bersifat case-sensitive pada nama variabel."],
examples:[["echo",`<?php
echo "Selamat datang di kelas X RPL";
?>`],["Komentar",`<?php
// Ini komentar satu baris
# Ini juga komentar
/*
   Komentar beberapa baris
*/
echo "Program berjalan";
?>`]],
errors:["Menulis <? php dengan spasi.","Lupa ; setelah perintah.","Menggunakan nama variabel yang berbeda huruf besar-kecil."],
task:"Buat program yang menampilkan 5 informasi tentang diri sendiri dan beri komentar pada setiap bagian.",
challenge:"Buat halaman profil sederhana yang memadukan HTML dan PHP."
},
{
title:"Variabel dan Tipe Data",level:"Dasar",goal:"Menyimpan data dan memahami string, integer, float, serta boolean.",keywords:["variabel","string","integer","boolean"],
explain:`Variabel adalah tempat untuk menyimpan data sementara selama program berjalan. Dalam PHP, nama variabel diawali tanda $. Nilai dapat berupa teks, angka bulat, angka desimal, atau true/false.`,
analogy:`Variabel seperti kotak yang diberi label. Kotak bernama $nama berisi nama, kotak $kelas berisi kelas, dan seterusnya. Saat diperlukan, kita mengambil isi kotak tersebut.`,
points:["Variabel diawali $.","String menyimpan teks.","Integer menyimpan bilangan bulat.","Float menyimpan bilangan desimal.","Boolean menyimpan true atau false."],
examples:[["Variabel",`<?php
$nama = "Andi";
$kelas = "X RPL";
$umur = 16;
$nilai = 87.5;
$lulus = true;

echo $nama;
echo "<br>";
echo $kelas;
?>`],["Gabung teks",`<?php
$nama = "Andi";
echo "Halo " . $nama;
?>`]],
errors:["Menulis nama variabel tanpa $.","Nama variabel diawali angka.","Mengira nilai string harus selalu angka."],
task:"Buat variabel $nis, $nama, $kelas, $jurusan, dan $nilai. Tampilkan semuanya.",
challenge:"Tampilkan kalimat: 'Nama saya ... dari kelas ... dan nilai saya ...'."
},
{
title:"Operator PHP",level:"Dasar",goal:"Menggunakan operator aritmatika, perbandingan, dan logika.",keywords:["operator","hitung","perbandingan","logika"],
explain:`Operator adalah simbol yang digunakan untuk melakukan operasi pada data. Operator aritmatika digunakan untuk menghitung, operator perbandingan untuk membandingkan nilai, dan operator logika untuk menggabungkan kondisi.`,
analogy:`Kalkulator memakai operator +, -, ×, dan ÷. PHP memiliki operator serupa, ditambah operator untuk memeriksa apakah suatu kondisi benar atau salah.`,
points:["+ penjumlahan.","- pengurangan.","* perkalian.","/ pembagian.","% sisa bagi.","== membandingkan kesamaan nilai.",">= berarti lebih besar atau sama."],
examples:[["Aritmatika",`<?php
$a = 10;
$b = 3;

echo $a + $b;
echo "<br>";
echo $a * $b;
echo "<br>";
echo $a % $b;
?>`],["Perbandingan",`<?php
$nilai = 80;
var_dump($nilai >= 75);
?>`]],
errors:["Tertukar = dengan ==.","Salah memahami % sebagai persen; dalam PHP % adalah modulus/sisa bagi."],
task:"Buat program menghitung total harga 3 barang dan rata-rata nilainya.",
challenge:"Buat program menghitung luas dan keliling persegi panjang."
},
{
title:"Percabangan if, elseif, else",level:"Dasar",goal:"Membuat program yang dapat mengambil keputusan.",keywords:["if","else","elseif","kondisi"],
explain:`Percabangan digunakan ketika program harus memilih tindakan berdasarkan kondisi. Misalnya sistem sekolah perlu menentukan apakah nilai siswa lulus atau belum.`,
analogy:`Seperti aturan di sekolah: jika nilai minimal 75 maka lulus; jika kurang dari 75 maka belum lulus. Komputer menjalankan aturan tersebut secara konsisten.`,
points:["if memeriksa kondisi pertama.","elseif memeriksa kondisi berikutnya.","else dijalankan jika kondisi sebelumnya tidak terpenuhi.","Kondisi biasanya menghasilkan true atau false."],
examples:[["Lulus",`<?php
$nilai = 85;

if ($nilai >= 75) {
    echo "Lulus";
} else {
    echo "Belum Lulus";
}
?>`],["Predikat",`<?php
$nilai = 86;

if ($nilai >= 90) {
    echo "A";
} elseif ($nilai >= 80) {
    echo "B";
} elseif ($nilai >= 70) {
    echo "C";
} else {
    echo "D";
}
?>`]],
errors:["Kondisi tidak memakai operator perbandingan yang benar.","Kurung kurawal tidak lengkap.","Urutan kondisi membuat hasil tidak sesuai."],
task:"Buat penilaian A-D berdasarkan nilai siswa.",
challenge:"Buat program yang menentukan 'Remedial' jika nilai < 75 dan 'Lulus' jika nilai >= 75."
},
{
title:"Perulangan",level:"Dasar",goal:"Mengulang pekerjaan menggunakan for, while, dan foreach.",keywords:["loop","for","while","foreach"],
explain:`Perulangan digunakan ketika pekerjaan yang sama perlu dilakukan berkali-kali. Daripada menulis echo sepuluh kali, kita dapat membuat satu perulangan.`,
analogy:`Guru ingin menuliskan nama 30 siswa. Daripada membuat perintah satu per satu, komputer dapat mengulang perintah berdasarkan jumlah data.`,
points:["for cocok jika jumlah pengulangan diketahui.","while cocok jika pengulangan bergantung pada kondisi.","foreach cocok untuk menelusuri array."],
examples:[["for",`<?php
for ($i = 1; $i <= 5; $i++) {
    echo "Data ke-$i<br>";
}
?>`],["foreach",`<?php
$siswa = ["Andi", "Budi", "Citra"];

foreach ($siswa as $nama) {
    echo $nama . "<br>";
}
?>`]],
errors:["Lupa menaikkan nilai counter sehingga loop tidak berhenti.","Salah menulis batas kondisi.","Mengakses index array yang tidak ada."],
task:"Tampilkan angka 1-20 menggunakan for dan daftar 5 nama menggunakan foreach.",
challenge:"Tampilkan tabel perkalian 1 sampai 10."
},
{
title:"Array",level:"Menengah",goal:"Menyimpan banyak data dalam satu variabel.",keywords:["array","index","associative","foreach"],
explain:`Array digunakan untuk menyimpan sekumpulan nilai. Array indexed menggunakan angka index, sedangkan associative array menggunakan key seperti nama, kelas, dan jurusan.`,
analogy:`Array seperti laci dengan banyak slot. Setiap slot memiliki posisi. Associative array seperti lemari dengan label: slot 'nama', 'kelas', dan 'jurusan'.`,
points:["Index array dimulai dari 0.","Associative array memiliki key dan value.","foreach sangat berguna untuk membaca isi array.","Array dapat berisi teks, angka, atau data lain."],
examples:[["Indexed array",`<?php
$buah = ["Apel", "Jeruk", "Mangga"];

echo $buah[0];
echo "<br>";
echo $buah[2];
?>`],["Associative array",`<?php
$siswa = [
    "nama" => "Andi",
    "kelas" => "X RPL",
    "jurusan" => "RPL"
];

echo $siswa["nama"];
?>`]],
errors:["Lupa bahwa index dimulai dari 0.","Salah menulis key associative array.","Menggunakan array tanpa memahami struktur datanya."],
task:"Buat associative array berisi NIS, nama, kelas, jurusan, dan nilai.",
challenge:"Buat array berisi 5 siswa lalu tampilkan semuanya dalam bentuk tabel HTML."

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function lineExplain(line){
 const raw=line, s=line.trim();
 if(!s) return "Baris kosong untuk membuat kode lebih mudah dibaca.";
 if(s.startsWith("<?php")) return "Membuka blok PHP. Kode PHP yang berada setelah baris ini akan diproses oleh PHP.";
 if(s==="?>" || s==="?>;") return "Menutup blok PHP.";
 if(s.startsWith("//")) return "Komentar satu baris. Baris ini hanya menjadi catatan untuk programmer dan tidak dijalankan.";
 if(s.startsWith("#")) return "Komentar satu baris. Digunakan sebagai catatan dan tidak dijalankan.";
 if(s.startsWith("/*")) return "Memulai komentar beberapa baris.";
 if(s.endsWith("*/")) return "Mengakhiri komentar beberapa baris.";
 if(/^<!DOCTYPE html/i.test(s)) return "Memberi tahu browser bahwa dokumen menggunakan standar HTML5.";
 if(/^<html/i.test(s)) return "Membuka elemen utama HTML yang membungkus seluruh halaman.";
 if(/^<\/html/i.test(s)) return "Menutup elemen utama HTML.";
 if(/^<head/i.test(s)) return "Membuka bagian head, tempat informasi halaman dan konfigurasi ditempatkan.";
 if(/^<\/head/i.test(s)) return "Menutup bagian head.";
 if(/^<body/i.test(s)) return "Membuka bagian body, yaitu bagian yang berisi isi halaman yang terlihat.";
 if(/^<\/body/i.test(s)) return "Menutup bagian body.";
 if(/^<h[1-6]/i.test(s)) return "Membuat judul/heading pada halaman HTML.";
 if(/^<\/h[1-6]/i.test(s)) return "Menutup elemen heading.";
 if(/^<br/i.test(s)) return "Membuat pindah baris pada tampilan HTML.";
 if(/^<form/i.test(s)) return "Membuka form HTML. Atribut method menentukan cara data dikirim ke PHP.";
 if(/^<\/form/i.test(s)) return "Menutup form HTML.";
 if(/^<input/i.test(s)) return "Membuat kotak input agar pengguna dapat memasukkan data.";
 if(/^<button/i.test(s)) return "Membuat tombol pada form.";
 if(/^<\/button/i.test(s)) return "Menutup elemen tombol.";
 if(/^<label/i.test(s)) return "Membuat label/keterangan untuk sebuah input.";
 if(/^<\/label/i.test(s)) return "Menutup elemen label.";
 if(/^echo\b/.test(s)){
   return "Perintah echo digunakan untuk menampilkan teks atau hasil ke halaman. Titik koma (;) menandai akhir perintah.";
 }
 if(/^var_dump\b/.test(s)) return "var_dump() menampilkan informasi nilai dan tipe data sebuah variabel. Berguna untuk memeriksa isi data saat belajar/debugging.";
 if(/^function\s+/.test(s)){
   const m=s.match(/^function\s+(\w+)/);
   return `Mendefinisikan function bernama ${m?m[1]:"tersebut"}. Function adalah blok kode yang dapat dipanggil kembali.`;
 }
 if(/^return\b/.test(s)) return "return mengembalikan hasil dari function kepada bagian program yang memanggilnya.";
 if(/^if\s*\(/.test(s)) return "if memeriksa sebuah kondisi. Jika kondisi bernilai benar (true), kode di dalam blok ini dijalankan.";
 if(/^elseif\s*\(/.test(s)) return "elseif memeriksa kondisi alternatif jika kondisi sebelumnya tidak terpenuhi.";
 if(/^else\s*\{/.test(s)) return "else dijalankan jika kondisi if/elseif sebelumnya tidak terpenuhi.";
 if(/^for\s*\(/.test(s)) return "for membuat perulangan. Bagian di dalam kurung menentukan nilai awal, kondisi berhenti, dan perubahan penghitung.";
 if(/^while\s*\(/.test(s)) return "while mengulang kode selama kondisi di dalam kurung masih bernilai benar.";
 if(/^foreach\s*\(/.test(s)) return "foreach mengambil data array satu per satu agar setiap elemen dapat diproses.";
 if(/^include\b/.test(s)) return "include memasukkan isi file PHP lain ke file yang sedang dijalankan.";
 if(/^require\b/.test(s)) return "require memasukkan file lain dan biasanya digunakan untuk file yang wajib tersedia.";
 if(/^\$[A-Za-z_]\w*\s*=/.test(s)){
   const m=s.match(/^\$([A-Za-z_]\w*)/);
   return `Membuat atau mengisi variabel $${m?m[1]:"tersebut"}. Tanda = digunakan untuk memberikan nilai kepada variabel.`;
 }
 if(/^\$\w+\s*\+\+/.test(s)) return "Menambah nilai variabel penghitung sebanyak 1 pada setiap putaran.";
 if(/^\$\w+\s*\+=/.test(s)) return "Menambah nilai variabel dengan nilai tertentu.";
 if(/^mysqli_connect\s*\(/.test(s)) return "Membuat koneksi PHP ke database MySQL/MariaDB menggunakan host, username, password, dan nama database.";
 if(/^mysqli_prepare\s*\(/.test(s)) return "Menyiapkan query SQL dengan prepared statement agar input pengguna tidak langsung digabungkan ke SQL.";
 if(/^mysqli_stmt_bind_param\s*\(/.test(s)) return "Mengikat nilai variabel ke placeholder (?) pada prepared statement.";
 if(/^mysqli_stmt_execute\s*\(/.test(s)) return "Menjalankan prepared statement yang sudah disiapkan.";
 if(/^mysqli_query\s*\(/.test(s)) return "Mengirim query SQL ke database menggunakan koneksi yang tersedia.";
 if(/^while\s*\(\s*\$\w+\s*=\s*mysqli_fetch_assoc/.test(s)) return "Mengambil setiap baris hasil query sebagai associative array selama masih ada data.";
 if(/^mysqli_fetch_assoc\s*\(/.test(s)) return "Mengambil satu baris hasil query dalam bentuk associative array.";
 if(/^if\s*\(!\$koneksi/.test(s)) return "Memeriksa apakah koneksi database gagal.";
 if(/^die\s*\(/.test(s)) return "Menghentikan program dan menampilkan pesan ketika kondisi error terjadi.";
 if(/^htmlspecialchars\s*\(/.test(s)) return "Mengubah karakter khusus HTML menjadi bentuk aman saat menampilkan input pengguna.";
 if(/^CREATE\s+DATABASE/i.test(s)) return "Perintah SQL untuk membuat database baru.";
 if(/^CREATE\s+TABLE/i.test(s)) return "Perintah SQL untuk membuat tabel baru di dalam database.";
 if(/^SELECT\b/i.test(s)) return "Perintah SQL SELECT digunakan untuk mengambil data dari tabel.";
 if(/^INSERT\b/i.test(s)) return "Perintah SQL INSERT digunakan untuk menambahkan data baru ke tabel.";
 if(/^UPDATE\b/i.test(s)) return "Perintah SQL UPDATE digunakan untuk mengubah data yang sudah ada.";
 if(/^DELETE\b/i.test(s)) return "Perintah SQL DELETE digunakan untuk menghapus data.";
 if(/^WHERE\b/i.test(s)) return "WHERE menentukan baris/data tertentu yang menjadi target operasi SQL.";
 if(s==="{" ) return "Kurung kurawal membuka blok kode.";
 if(s==="}") return "Kurung kurawal menutup blok kode.";
 if(s.endsWith(";")) return "Baris ini merupakan statement/perintah PHP. Titik koma (;) menandai akhir statement.";
 if(s.includes("=>")) return "Simbol => menghubungkan key dengan value pada associative array.";
 return "Baris ini merupakan bagian dari kode yang menjalankan instruksi pada program.";
}

}

   return `__SIM_WARNING__Kode ini menggunakan fitur PHP server/database yang tidak dapat dijalankan oleh simulator browser.\n\n${unsupported==='database'?'🗄️ Terdeteksi MySQL/MariaDB (mysqli/PDO).':'🖥️ Terdeteksi fitur server PHP.'}\n\nUntuk praktik nyata:\n1. Jalankan Apache dan MySQL di XAMPP.\n2. Simpan file .php di C:\\xampp\\htdocs\\...\n3. Buka melalui http://localhost/...\n\nSimulator ini tetap dapat digunakan untuk memahami konsep PHP dasar.`;
 }
 let vars={__input:input,__requestMethod:'POST'};
 // arrays and scalar assignments that occur before control structures
 for(const st of splitStatements(s)){parseArrayAssignment(st,vars);parseAssignment(st,vars);}
 s=executeFunctionsAndReturn(s,vars);
 let out=executeBlockProgram(s,vars);
 if(!out.trim())out="(Program berhasil diproses, tetapi tidak menghasilkan output.)";
 return out;
}
function runCode(i){
 const ed=document.getElementById("editor"+i),outEl=document.getElementById("output"+i),meta=document.getElementById("runmeta"+i);if(!ed||!outEl)return;
 const code=ed.value;savedCodes[i]=code;localStorage.setItem("phpHubCodes",JSON.stringify(savedCodes));
 refreshSimInputs(i);
 const input=readSimInputs(i);
 outEl.className="output";outEl.textContent="⏳ Menjalankan simulasi...";if(meta)meta.textContent="Menganalisis kode PHP di browser...";
 setTimeout(()=>{
  try{
   const unsupported=detectUnsupported(code);
   if(unsupported){
     outEl.className="output warn";
     outEl.innerHTML=serverLabHtml(unsupported);
     if(meta)meta.textContent="ℹ️ Mode praktik nyata: jalankan kode ini dengan PHP + XAMPP.";
     return;
   }
   const out=interp(code,input);
   if(out.startsWith("__SIM_WARNING__")){
     outEl.className="output warn";outEl.innerHTML=serverLabHtml("server");
     if(meta)meta.textContent="ℹ️ Kode ini memerlukan PHP server.";return;
   }
   outEl.className="output success";
   outEl.textContent=out.trim()?out:"✓ Program selesai dijalankan.\n\nTidak ada output yang dicetak. Jika ingin melihat hasil, gunakan echo atau print.";
   if(meta)meta.textContent="✓ Simulasi selesai. Input pada panel digunakan sebagai $_POST/$_GET.";
  }catch(e){outEl.className="output error";outEl.textContent="❌ Simulator menemukan sintaks/fitur yang belum didukung.\n\n"+e.message+"\n\nUntuk PHP asli, jalankan kode melalui XAMPP.";if(meta)meta.textContent="Periksa kembali kode atau gunakan XAMPP.";}
 },80);
}

function toggleDone(i){if(done.includes(i))done=done.filter(x=>x!==i);else done.push(i);localStorage.setItem("phpHubDone",JSON.stringify(done));nav();lesson(i)}

 document.getElementById("content").innerHTML=`<div class="card"><h2>🗺️ Roadmap Belajar</h2><p class="muted">Belajar berurutan agar konsep tidak meloncat.</p><div class="grid">${lessons.map((x,i)=>`<div class="mini"><b>${i+1}. ${x.title}</b><p>${x.goal}</p><button class="btn" onclick="lesson(${i})">Pelajari</button></div>`).join("")}</div></div>`;

function quiz(){
 answers={};let h=`<div class="card"><h2>📝 Kuis Mandiri</h2><p class="muted">Pilih jawaban. Nilai dapat digunakan siswa untuk mengetahui materi yang perlu diulang.</p>`;
 quizData.forEach((q,i)=>{h+=`<div class="card" style="box-shadow:none;background:#f8fafc"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="quiz-option" onclick="ans(${i},${j},this)">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}<div id="qres${i}"></div></div>`});
 h+=`<button class="btn primary" onclick="grade()">Lihat Nilai</button><div id="score" style="margin-top:14px"></div></div>`;document.getElementById("content").innerHTML=h}
function ans(i,j,b){answers[i]=j;document.querySelectorAll("#qres"+i+"").forEach(x=>x.textContent="Jawaban dipilih.")}
function grade(){let n=quizData.reduce((a,q,i)=>a+(answers[i]===q[2]?1:0),0);document.getElementById("score").innerHTML=`<div class="callout ${n>=10?"green":"orange"}"><b>Nilai ${Math.round(n/quizData.length*100)}/100</b><br>${n>=10?"Sangat baik. Lanjutkan ke proyek akhir.":"Ulangi materi yang belum dikuasai dan coba lagi."}</div>`}
